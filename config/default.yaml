# KFS_grab 配置文件
# 所有可调参数集中管理，运行时通过 rosparam 加载

# ---- 相机内参 (fallback，运行时会从 RealSense 自动更新) ----
camera:
  fx: 321.6
  fy: 321.6
  cx: 320.7
  cy: 174.2

# ---- YOLO 模型 ----
yolo:
  model_path: "/home/zjy/roboncon2025_ws/src/yolo_depth_pkg/scripts/best.pt"
  img_sz: 640
  conf: 0.5
  iou: 0.5

# ---- 串口 ----
serial:
  port: "/dev/ttyUSB0"
  baudrate: 115200
  timeout: 1.0

# ---- Mask 处理 ----
mask:
  erode_kernel: 5           # 椭圆核大小
  erode_iterations: 2       # 腐蚀迭代次数
  min_mask_area: 50         # 最小 mask 面积 (像素)
  erosion_min_area: 100     # 腐蚀后最小面积，低于此值回退到原始 mask
  polygon_epsilon_factor: 0.015  # approxPolyDP 精度 (x 周长)

# ---- 法线采样 ----
normal:
  sample_half_window: 8     # 邻域半宽 (总窗口 = 2*half+1)，默认 17x17
  min_valid_points: 30      # 邻域内最少有效深度点数
  cluster_cosine_threshold: 0.6  # 余弦相似度聚类阈值

# ---- 深度滤波 ----
depth:
  min_mm: 0                 # 有效深度最小值 (mm)
  max_mm: 3000              # 有效深度最大值 (mm)

# ---- KFS 正方体 ----
cube:
  side_mm: 350.0            # 正方体边长

# ---- Z 轴滤波 ----
z_filter:
  buffer_size: 5
  anomaly_threshold_mm: 300

# ---- ROS topic 名称 ----
ros:
  pose_topic: "/kfs_pose"
  coord_topic: "/center_coord"
  frame_id: "map"

# ---- 坐标轴映射偏移 (相机系 → base_link 系) ----
axis_mapping:
  # 轴映射: (x,y,z) → (new_x, new_y, new_z) 其中 new = (z, x, -y)
  # offset 在映射后叠加
  offset_x_mm: 0.0
  offset_y_mm: 0.0
  offset_z_mm: 0.0
